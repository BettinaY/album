<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>BY照片精选</title>
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
  <style>
    body { margin: 0; background: #111; font-family: sans-serif; }
    h1 { text-align: center; color: #fff; padding: 20px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      padding: 10px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      cursor: pointer;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>BY照片精选</h1>

<div class="gallery" id="gallery">
  <!-- 照片会由 JavaScript 自动生成 -->
</div>

<script type="module">
  import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js';

  const galleryDiv = document.getElementById('gallery');

  // 在这里填你的照片文件名数组
  const photoFiles = [
    '01.jpg',
    '02.jpg',
    '03.jpg',
    '04.jpg',
    '05.jpg',
    // 如果有更多照片，直接在这里加名字
  ];

  photoFiles.forEach(file => {
    const img = new Image();
    img.src = `photos/${file}`;
    img.onload = () => {
      const a = document.createElement('a');
      a.href = img.src;
      a.setAttribute('data-pswp-width', img.naturalWidth);
      a.setAttribute('data-pswp-height', img.naturalHeight);
      a.appendChild(img);
      galleryDiv.appendChild(a);
    };
  });

  const lightbox = new PhotoSwipeLightbox({
    gallery: '#gallery',
    children: 'a',
    pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js')
  });
  lightbox.init();
</script>

</body>
</html>
