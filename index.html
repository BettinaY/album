<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>BY照片精选</title>
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
  <style>
    body { margin: 0; background: #111; font-family: sans-serif; }
    h1 { text-align: left; color: #fff; padding: 20px; }
  
.gallery {
  column-count: 2;
  column-gap: 16px;
  padding: 16px;
}

/* 电脑端 */
@media (min-width: 768px) {
  .gallery {
    column-count: 3;
  }
}

.gallery a {
  display: inline-block;
  width: 100%;
  margin-bottom: 16px;
  break-inside: avoid;   /* 关键：防止图片被切断 */
  text-decoration: none;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
  background: #222;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* 非常克制的交互感 */
.gallery a:hover img {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}

  </style>
</head>
<body>

<h1>BY照片精选</h1>

<div class="gallery" id="gallery">
  <!-- 照片会由 JavaScript 自动生成 -->
</div>

<script type="module">
  import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js';

  const galleryDiv = document.getElementById('gallery');

  // 在这里填你的照片文件名数组
  const photoFiles = [
    '01.jpg',
    '02.jpg',
    '03.jpg',
    '04.jpg',
    '05.jpg',
    '06.jpg',
    '07.jpg',
    '08.jpg',
    '09.jpg',
    '10.jpg',
    // 如果有更多照片，直接在这里加名字
  ];

  photoFiles.forEach(file => {
    const img = new Image();
    img.src = `photos/${file}`;
    img.onload = () => {
      const a = document.createElement('a');
      a.href = img.src;
      a.setAttribute('data-pswp-width', img.naturalWidth);
      a.setAttribute('data-pswp-height', img.naturalHeight);
      a.appendChild(img);
      galleryDiv.appendChild(a);
    };
  });

  const lightbox = new PhotoSwipeLightbox({
    gallery: '#gallery',
    children: 'a',
    pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js')
  });
  lightbox.init();
</script>

</body>
</html>
